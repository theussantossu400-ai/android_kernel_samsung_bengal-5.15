name: Compilador Kernel A05s
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Baixando o Codigo
      uses: actions/checkout@v4
      with:
        ref: android-13

    - name: Configurando as Ferramentas do Sistema
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq bc build-essential libssl-dev localmodconfig libelf-dev flex bison git clang lld

    - name: Injetando o KernelSU Nativo
      run: |
        cd $GITHUB_WORKSPACE
        curl -LSs "https://githubusercontent.com" | bash -s main

    - name: Compilando o Kernel Bengal
      run: |
        cd $GITHUB_WORKSPACE
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make O=out ARCH=arm64 vendor/bengal-gki_defconfig
        make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld

    - name: Gerando e Subindo o Boot.img Pronto
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-A05s-ClocksMaximos-KernelSU
        path: out/arch/arm64/boot/Image

