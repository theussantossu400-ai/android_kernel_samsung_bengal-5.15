name: Compilador Kernel A05s

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Baixando o Código
      uses: actions/checkout@v4
      with:
        ref: android-13

    - name: Configurando as Ferramentas do Sistema
      run: |
        sudo apt-get update -y
        sudo apt-get install -y -qy bc build-essential libssl-dev libelf-dev flex bison git lld nano zip

    - name: Baixando o Provedor Clang Oficial do AOSP
      run: |
        cd $GITHUB_WORKSPACE
        mkdir clang
        cd clang
        wget https://googlesource.com
        tar -xf clang-r487747c.tar.gz
        echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

    - name: Injetando o KernelSU Nativo
      run: |
        cd $GITHUB_WORKSPACE
        curl -LSs "https://kernelsu.org" | bash -s main

    - name: Compilando o Kernel Bengal
      run: |
        cd $GITHUB_WORKSPACE
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make O=out ARCH=arm64 vendor/bengal-gki_defconfig
        make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld

    - name: Empacotamento Limpo (AnyKernel3)
      run: |
        cd $GITHUB_WORKSPACE
        git clone https://github.com AnyKernel
        cp out/arch/arm64/boot/Image AnyKernel/
        cd AnyKernel
        sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot;/block=\/dev\/block\/by-name\/boot;/g' anykernel.sh
        zip -r9 ../bengal_kernel.zip *

    - name: Gerando o Artefato Pronto
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-A05s-ClocksMaximos
        path: bengal_kernel.zip
